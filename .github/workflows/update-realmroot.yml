name: Update Realmroot Formula

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update to the latest Realmroot CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo realmroot/cli --json tagName --jq .tagName)"
          version="${tag#v}"
          curl --fail --location --silent --show-error \
            --output checksums.txt \
            "https://github.com/realmroot/cli/releases/download/${tag}/checksums.txt"
          darwin_arm64="$(awk -v name="realmroot_${version}_darwin_arm64.tar.gz" '$2 == name { print $1 }' checksums.txt)"
          darwin_amd64="$(awk -v name="realmroot_${version}_darwin_amd64.tar.gz" '$2 == name { print $1 }' checksums.txt)"
          linux_arm64="$(awk -v name="realmroot_${version}_linux_arm64.tar.gz" '$2 == name { print $1 }' checksums.txt)"
          linux_amd64="$(awk -v name="realmroot_${version}_linux_amd64.tar.gz" '$2 == name { print $1 }' checksums.txt)"
          test -n "$darwin_arm64"
          test -n "$darwin_amd64"
          test -n "$linux_arm64"
          test -n "$linux_amd64"
          VERSION="$version" \
            DARWIN_ARM64="$darwin_arm64" DARWIN_AMD64="$darwin_amd64" \
            LINUX_ARM64="$linux_arm64" LINUX_AMD64="$linux_amd64" ruby <<'RUBY'
          path = "Formula/realmroot.rb"
          content = File.read(path)
          version = ENV.fetch("VERSION")
          replaced = content.gsub!(%r{releases/download/v[^/]+/realmroot_[^_]+_}) do
            "releases/download/v#{version}/realmroot_#{version}_"
          end
          raise "missing Formula release URLs" unless replaced
          {
            "darwin_arm64" => ENV.fetch("DARWIN_ARM64"),
            "darwin_amd64" => ENV.fetch("DARWIN_AMD64"),
            "linux_arm64" => ENV.fetch("LINUX_ARM64"),
            "linux_amd64" => ENV.fetch("LINUX_AMD64"),
          }.each do |archive, checksum|
            pattern = /(url "[^"]+_#{archive}\.tar\.gz"\n\s+sha256 ")[a-f0-9]+"/
            raise "missing #{archive} Formula entry" unless content.sub!(pattern, "\\1#{checksum}\"")
          end
          File.write(path, content)
          RUBY
          rm checksums.txt
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/realmroot.rb
          git commit -m "chore(formula): update realmroot to ${version}"
          git push
