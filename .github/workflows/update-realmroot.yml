name: Update Realmroot Formula

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update to the latest Realmroot CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo realmroot/cli --json tagName --jq .tagName)"
          version="${tag#v}"
          curl --fail --location --silent --show-error \
            --output source.tar.gz \
            "https://github.com/realmroot/cli/archive/refs/tags/${tag}.tar.gz"
          source_sha="$(sha256sum source.tar.gz | awk '{ print $1 }')"
          test -n "$source_sha"
          VERSION="$version" SOURCE_SHA="$source_sha" ruby <<'RUBY'
          path = "Formula/realmroot.rb"
          content = File.read(path)
          version = ENV.fetch("VERSION")
          raise "missing Formula release URL" unless content.sub!(%r{archive/refs/tags/v[^/]+\.tar\.gz}, "archive/refs/tags/v#{version}.tar.gz")
          raise "missing Formula checksum" unless content.sub!(/sha256 "[a-f0-9]+"/, "sha256 \"#{ENV.fetch("SOURCE_SHA")}\"")
          File.write(path, content)
          RUBY
          rm source.tar.gz
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/realmroot.rb
          git commit -m "chore(formula): update realmroot to ${version}"
          git push
